<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTRA INDUSTRIAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-50">

    <header class="w-full relative overflow-x-hidden">

        <div class="relative z-10">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative">

                <div class="absolute top-0 bottom-0 right-[-100vw] left-[-100px] custom-shape-blue z-[-1]"></div>


                <div class="flex flex-col md:flex-row justify-between items-center h-28 md:h-24 py-4">

                    <div class="flex items-center mb-4 md:mb-0">
                        <img src="logo.png" alt="XTRA INDUSTRIAL" class="h-16 w-auto object-contain">
                    </div>


                    <div class="flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-8 text-white">
                        <div class="flex items-center">
                            <div class="text-yellow-400 text-3xl mr-3">
                                <i class="fa-solid fa-phone-volume"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400">Have any questions?</p>
                                <p class="text-lg font-bold">+1 (818) 333 44 55</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <div class="text-yellow-400 text-3xl mr-3">
                                <i class="fa-solid fa-location-dot"></i>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400">Our office address</p>
                                <p class="text-lg font-bold">22345, King St, California</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <div class="relative z-20 mt-2">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 relative">

                <div class="absolute top-0 bottom-0 left-[-100vw] right-[-100px] custom-shape-yellow z-[-1]"></div>


                <div class="h-14 flex items-center justify-between">

                    <div class="flex items-center space-x-4 text-slate-800 text-lg">
                        <a href="#" class="hover:text-black"><i class="fa-brands fa-facebook-f"></i></a>
                        <a href="#" class="hover:text-black"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#" class="hover:text-black"><i class="fa-brands fa-linkedin-in"></i></a>
                        <a href="#" class="hover:text-black"><i class="fa-brands fa-x-twitter"></i></a>
                    </div>


                    <div class="hidden md:flex items-center space-x-6 font-bold text-slate-800 text-sm uppercase">
                        <a href="#" class="text-blue-900">Home</a>
                        <a href="#" class="hover:text-blue-900">About</a>
                        <a href="#" class="hover:text-blue-900">Services</a>
                        <a href="#" class="hover:text-blue-900">Blog</a>
                        <a href="#" class="hover:text-blue-900">Projects</a>
                        <a href="#" class="hover:text-blue-900">Shop</a>
                        <a href="#" class="hover:text-blue-900 flex items-center">Pages <i
                                class="fa-solid fa-chevron-down ml-1 text-xs"></i></a>
                        <a href="#" class="hover:text-blue-900">Contact</a>
                    </div>


                    <div class="flex items-center space-x-5 text-slate-800">
                        <a href="#" class="text-xl hover:text-black"><i class="fa-solid fa-magnifying-glass"></i></a>
                        <a href="#" class="text-xl hover:text-black relative">
                            <i class="fa-solid fa-cart-shopping"></i>
                            <span
                                class="absolute -top-2 -right-2 bg-blue-900 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-sm">0</span>
                        </a>
                        <a href="#" class="text-xl hover:text-black md:hidden"><i class="fa-solid fa-bars"></i></a>
                        <a href="#" class="text-xl hover:text-black hidden md:block"><i
                                class="fa-solid fa-bars"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'xtra-blue': '#0f2346',
                        'xtra-yellow': '#fcee21',
                    }
                }
            }
        }
    </script>
</body>

</html>
